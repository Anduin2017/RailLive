name: Build and publish RailLive

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: raillive-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      site_ready: ${{ steps.build.outputs.site_ready }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check source
        run: |
          python3 -m compileall -q backend tools tests
          for file in web/*.js; do node --check "$file"; done
      - name: Build and verify the static site
        id: build
        env:
          SNAPSHOT_URL: ${{ secrets.RAILLIVE_SNAPSHOT_URL }}
          SNAPSHOT_SHA256: ${{ vars.RAILLIVE_SNAPSHOT_SHA256 }}
        shell: bash
        run: |
          if [[ -z "$SNAPSHOT_URL" && -z "$SNAPSHOT_SHA256" ]]; then
            echo 'Static build skipped. Configure the snapshot source and checksum in repository settings.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$SNAPSHOT_URL" != https://* || ! "$SNAPSHOT_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo 'Configure an HTTPS snapshot URL and its lowercase SHA-256.' >&2
            exit 1
          fi

          archive="$RUNNER_TEMP/raillive-snapshot.tar.gz"
          snapshot="$RUNNER_TEMP/raillive-snapshot"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --retry 3 --max-time 300 --output "$archive" -- "$SNAPSHOT_URL"
          printf '%s  %s\n' "$SNAPSHOT_SHA256" "$archive" | sha256sum --check
          mkdir "$snapshot"
          tar -xzf "$archive" -C "$snapshot"

          python3 tools/build_static.py --snapshot "$snapshot" --output dist/site
          python3 tools/prepare.py --snapshot "$snapshot"
          python3 -m unittest discover -s tests/snapshot -p 'test_*.py'
          python3 tests/snapshot/verify_static_records.py dist/site
          python3 tests/snapshot/verify_space_tiles.py dist/site/space-time
          python3 - <<'PY'
          from pathlib import Path
          files = [entry for entry in Path('dist/site').rglob('*') if entry.is_file()]
          size = sum(entry.stat().st_size for entry in files)
          print(f'Pages site has {len(files):,} files and {size:,} bytes.')
          if size > 1_000_000_000:
              raise SystemExit('The site exceeds the GitHub Pages 1 GB limit.')
          PY
          echo 'site_ready=true' >> "$GITHUB_OUTPUT"
      - name: Upload Pages artifact
        if: steps.build.outputs.site_ready == 'true' && vars.RAILLIVE_PUBLISH_PAGES == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/site

  deploy:
    if: needs.build.outputs.site_ready == 'true' && vars.RAILLIVE_PUBLISH_PAGES == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
